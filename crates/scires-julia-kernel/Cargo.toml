[package]
name = "scires-julia-kernel"
description = "Direct Rust Jupyter/ZeroMQ Julia kernel adapter for SciRes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes = "1"
hex = "0.4"
hmac = "0.12"
scires-core.workspace = true
scires-kernel.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }
uuid = { version = "1", features = ["v4"] }
zeromq = { version = "0.7", default-features = false, features = ["tokio-runtime", "tcp-transport"] }

[lints]
workspace = true
