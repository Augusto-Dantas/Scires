[workspace]
resolver = "2"
members = [
    "crates/scires-core",
    "crates/scires-kernel",
    "crates/scires-debug",
    "crates/scires-plugin",
    "crates/scires-viz",
    "crates/scires-ui",
    "crates/scires-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/Augusto-Dantas/scires"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
semver = { version = "1", features = ["serde"] }
scires-core = { path = "crates/scires-core" }
scires-kernel = { path = "crates/scires-kernel" }
scires-debug = { path = "crates/scires-debug" }
scires-plugin = { path = "crates/scires-plugin" }
scires-viz = { path = "crates/scires-viz" }
scires-ui = { path = "crates/scires-ui" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
invalid_codeblock_attributes = "warn"
invalid_html_tags = "warn"
bare_urls = "warn"
